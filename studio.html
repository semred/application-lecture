<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو المؤلف — الإصدار المكتبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--primary:#0d5c4a;--primary-hover:#084336;--secondary:#27ae60;--accent:#ef6c00;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--border:#e2e8f0;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px}
.container{max-width:1500px;margin:0 auto;padding:20px}
header{background:linear-gradient(135deg,#0d5c4a 0%,#15735d 100%);color:#fff;padding:20px 24px;border-radius:18px;box-shadow:0 10px 25px -5px rgba(13,92,74,.2);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{font-size:1.5em;font-weight:900;display:flex;align-items:center;gap:8px}
header p{opacity:.9;font-size:.85em}
.badge-desktop{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:30px;font-size:.8em;font-weight:bold}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:18px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.03)}
.card h2{font-size:1.15em;color:var(--primary);margin-bottom:15px;padding-bottom:8px;border-bottom:2px solid #e0f2f1;display:flex;align-items:center;gap:6px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:12px}
label{display:block;margin-bottom:5px;font-weight:700;font-size:.88em;color:#334155}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.92em;transition:all .2s;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,92,74,.15)}
textarea.arabic-text{font-family:'Amiri',serif;font-size:1.15em;line-height:2;min-height:100px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:none;font-weight:700;font-size:.85em;cursor:pointer;transition:all .2s;color:#fff;font-family:inherit;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-primary{background:var(--primary)}.btn-secondary{background:#0284c7}.btn-success{background:var(--secondary)}
.btn-warning{background:var(--accent)}.btn-dark{background:#0f172a}.btn-danger{background:var(--danger)}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{background:#f1f5f9;color:var(--text)}
.btn-sm{padding:4px 10px;font-size:.75em}
.toolbar-sticky{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 15px rgba(0,0,0,.05);position:sticky;top:10px;z-index:100}
.app-layout{display:flex;gap:18px;align-items:flex-start}
.sidebar{width:340px;flex-shrink:0;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;padding:14px}
.main-area{flex:1;min-width:0}
@media(max-width:900px){.app-layout{flex-direction:column}.sidebar{width:100%;position:static;max-height:340px}}
.tree-root,.tree-children{list-style:none;padding:0;margin:0}
.tree-children{padding-right:14px;border-right:1px dashed #cbd5e1;margin-right:8px;margin-top:2px}
.tree-node{user-select:none}
.tree-row{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
.tree-row:hover{background:#f1f5f9}
.tree-row.active{background:#d1fae5;font-weight:700}
.tree-toggle{display:inline-block;width:14px;text-align:center;color:#64748b;font-size:.75em;transition:transform .15s}
.tree-node.collapsed>.tree-children{display:none}
.tree-node.collapsed>.tree-row .tree-toggle{transform:rotate(-90deg)}
.tree-label{flex:1;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-action{background:transparent;border:none;color:var(--primary);font-size:.7em;cursor:pointer;padding:2px 5px;border-radius:4px;font-family:inherit}
.tree-action:hover{background:var(--primary);color:#fff}
.subcard{background:#f8fafc;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.subcard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.preview-box{width:90px;height:90px;border-radius:8px;border:1.5px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f1f5f9;margin-top:4px}
.preview-box img{width:100%;height:100%;object-fit:contain}
.log-box{background:#0f172a;color:#38bdf8;font-family:monospace;direction:ltr;text-align:left;padding:12px;border-radius:8px;max-height:220px;overflow-y:auto;font-size:.8em;margin-top:10px}
.progress-bar-container{background:#e2e8f0;border-radius:20px;overflow:hidden;height:18px;margin:10px 0}
.progress-bar-fill{background:linear-gradient(90deg,var(--primary),var(--secondary));height:100%;width:0%;transition:width .3s;color:#fff;font-size:.7em;font-weight:bold;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:700;z-index:3000;display:none;animation:fadeIn .3s;font-size:.9em}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:750px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 70px rgba(0,0,0,.35);animation:popIn .2s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:1.05em}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-close{background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer;padding:0 6px;line-height:1}
.import-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:2px solid var(--border)}
.import-tab{padding:9px 14px;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:700;color:#64748b;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:.85em}
.import-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.import-pane{display:none}
.import-pane.active{display:block}
.json-viewer{font-family:monospace;font-size:.8em;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;max-height:60vh;overflow:auto;white-space:pre;direction:ltr;text-align:left}
.zone-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:end}
.pair-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:end}
.nav-tabs{display:flex;gap:6px;margin-bottom:15px;border-bottom:2px solid var(--border);overflow-x:auto}
.nav-tab{padding:8px 14px;border:none;background:none;cursor:pointer;font-family:inherit;font-weight:700;color:#64748b;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:.85em}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div class="container">
  <header>
    <div>
      <h1>💻 استوديو المؤلف</h1>
      <p>بيئة متكاملة لتأليف الكتب التفاعلية ونشرها</p>
    </div>
    <div class="badge-desktop">🖥️ مخصص للحاسوب</div>
  </header>

  <!-- BARRE OUTILS -->
  <div class="toolbar-sticky">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="openImportModal()">📂 استيراد</button>
      <button class="btn btn-success" onclick="openExportModal()">💾 تصدير / حفظ</button>
      <button class="btn btn-secondary" onclick="openJsonViewer()">{ } عرض JSON</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="draftStatus" style="font-size:.75em;color:#94a3b8;"></span>
      <button class="btn btn-outline" onclick="newBook()">✨ كتاب جديد</button>
    </div>
  </div>

  <!-- LAYOUT PRINCIPAL : ARBRE + PANNEAU -->
  <div class="app-layout">
    <aside class="sidebar card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="color:var(--primary);font-size:.95em;">🌳 هيكل الكتاب</strong>
      </div>
      <div id="tree"></div>
    </aside>
    <main class="main-area">
      <div id="contextPanel"></div>
    </main>
  </div>
</div>

<!-- ============ MODAL IMPORT ============ -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-header">
      <h3>📂 استيراد كتاب</h3>
      <button class="modal-close" onclick="closeModal('importModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="import-tabs">
        <button class="import-tab active" onclick="switchImportTab('pc',event)">📁 من الحاسوب (ZIP أو JSON)</button>
        <button class="import-tab" onclick="switchImportTab('github',event)">🌐 من GitHub</button>
      </div>
      <div class="import-pane active" id="importPane-pc">
        <p style="color:#64748b;margin-bottom:14px;font-size:.9em;">اختر ملف حزمة ZIP أو ملف JSON مُصدَّر سابقاً. سيتم استعادة جميع الصور والأصوات إذا كان الملف ZIP.</p>
        <input type="file" id="importFileInput" accept=".zip,.json" onchange="importFromPc(this)" style="padding:10px;border:2px dashed var(--border);border-radius:10px;width:100%;">
      </div>
      <div class="import-pane" id="importPane-github">
        <div class="form-grid">
          <div><label>المالك (Owner)</label><input type="text" id="impOwner" dir="ltr" placeholder="semred"></div>
          <div><label>المستودع (Repo)</label><input type="text" id="impRepo" dir="ltr" placeholder="livre_alphabetisation"></div>
          <div><label>الفرع (Branch)</label><input type="text" id="impBranch" value="main" dir="ltr"></div>
         
        <button class="btn btn-primary" onclick="loadGithubCatalogue()">📥 تحميل قائمة الكتب</button>
        <div id="githubBookList" style="margin-top:14px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL EXPORT ============ -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <div class="modal-header">
      <h3>💾 تصدير الكتاب</h3>
      <button class="modal-close" onclick="closeModal('exportModal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:#64748b;margin-bottom:16px;font-size:.9em;">اختر وجهة التصدير :</p>
      <div style="display:grid;gap:12px;">
        <button class="btn btn-success" style="padding:16px;font-size:1em;text-align:right;justify-content:flex-start;" onclick="exportToPc()">
          <div>💾 حفظ على الحاسوب (ملف ZIP)<br><small style="display:block;font-weight:normal;font-size:.78em;opacity:.85;margin-top:4px;">يشمل JSON + جميع الصور والأصوات</small></div>
        </button>
        <button class="btn btn-dark" style="padding:16px;font-size:1em;text-align:right;justify-content:flex-start;" onclick="openGithubPush()">
          <div>🚀 رفع إلى GitHub<br><small style="display:block;font-weight:normal;font-size:.78em;opacity:.85;margin-top:4px;">رفع الكتاب وتحديث الفهرس مباشرة</small></div>
        </button>
        <button class="btn btn-outline" style="padding:14px;text-align:right;justify-content:flex-start;" onclick="exportBundleJson()">
          <div>📄 حفظ المشروع فقط (JSON)<br><small style="display:block;font-weight:normal;font-size:.78em;opacity:.7;margin-top:4px;">يشمل كل شيء بما فيه الصور بصيغة base64</small></div>
        </button>
      </div>
      <div id="githubPushForm" style="display:none;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">
        <div class="form-grid">
          <div><label>Token *</label><input type="password" id="ghToken" dir="ltr"></div>
          <div><label>Owner *</label><input type="text" id="ghOwner" dir="ltr"></div>
          <div><label>Repo *</label><input type="text" id="ghRepo" dir="ltr"></div>
          <div><label>Branch</label><input type="text" id="ghBranch" value="main" dir="ltr"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-dark" onclick="exportFullPackageToGitHub()" id="btnGhExport">🚀 رفع الآن</button>
          <button class="btn btn-outline" onclick="saveGhConfig()">💾 حفظ الإعدادات</button>
        </div>
        <div id="ghProgressSection" style="display:none;margin-top:15px;">
          <div class="progress-bar-container"><div class="progress-bar-fill" id="ghProgressBar">0%</div></div>
          <div class="log-box" id="ghLogBox"></div>
        </div>
        <div id="ghUrlsSection" style="display:none;margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:10px;">
          <h4 style="color:#166534;margin-bottom:8px;font-size:.9em;">✅ تم الرفع بنجاح!</h4>
          <label style="font-size:.8em;">رابط الفهرس PWA :</label>
          <input type="text" id="finalCatalogUrl" readonly style="background:#fff;font-family:monospace;font-size:.8em;" dir="ltr">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL JSON ============ -->
<div class="modal-overlay" id="jsonModal">
  <div class="modal">
    <div class="modal-header">
      <h3>{ } عرض JSON</h3>
      <button class="modal-close" onclick="closeModal('jsonModal')">✕</button>
    </div>
    <div class="modal-body">
      <pre class="json-viewer" id="jsonViewerContent"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="copyJsonToClipboard()">📋 نسخ</button>
      <button class="btn btn-primary" onclick="downloadJson()">💾 تنزيل</button>
      <button class="btn btn-secondary" onclick="refreshJsonViewer()">🔄 تحديث</button>
      <button class="btn btn-outline" onclick="closeModal('jsonModal')">إغلاق</button>
    </div>
  </div>
</div>

<script>
/* ============ ÉTAT GLOBAL ============ */
const DRAFT_KEY = 'studio_draft_v1';
const GH_KEY = 'studio_gh_config';
let book = makeEmptyBook();
let activeNode = { type: 'book-info', params: {} };

function makeEmptyBook() {
  return {
    id: 'mon-livre',
    titre: '',
    couverture: '',
    couvertureData: null,
    description: '',
    auteur: '',
    niveau: 'moyen',
    pages: [makeEmptyPage(1)],
    resume: { texte: '', modeAudio: 'tts', audio: '', audioData: null }
  };
}

function makeEmptyPage(num) {
  return {
    numero: num, titreSection: '', image: '', imageData: null,
    texteAffiche: '', audioMode: 'tts', audioPage: '', audioData: null,
    mots: [], vocabulaire: [], exercices: [], notes: ''
  };
}

function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function splitMots(val) {
  return String(val || '').split(/[,،]/).map(s => s.trim()).filter(Boolean);
}
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || 'var(--primary)';
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.display = 'none'; }, 2500);
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function openModal(id) { document.getElementById(id).classList.add('show'); }

/* ============ AUTO-SAVE ============ */
let saveTimeout = null;
function scheduleAutoSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(doAutoSave, 800);
}
function doAutoSave() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(book));
    const st = document.getElementById('draftStatus');
    st.textContent = '✅ محفوظ تلقائياً ' + new Date().toLocaleTimeString('ar-DZ');
  } catch (e) {
    console.warn('Auto-save failed:', e.message);
    document.getElementById('draftStatus').textContent = '⚠️ مساحة التخزين ممتلئة';
  }
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.pages) return false;
    book = parsed;
    return true;
  } catch { return false; }
}

/* ============ TREE ============ */
function nodeKey(type, params) {
  return [type, params.pageIndex ?? '', params.vocabIndex ?? '', params.exIndex ?? ''].join('-');
}

function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const ul = document.createElement('ul');
  ul.className = 'tree-root';

  // Racine livre
  ul.appendChild(makeTreeNode({
    label: '📖 ' + (book.titre || 'كتاب بدون عنوان'),
    type: 'book-info', params: {}
  }));

  // Pages
  const pagesNode = makeTreeNode({
    label: '📄 الصفحات (' + book.pages.length + ')',
    type: 'pages-list', params: {},
    actions: [{ label: '+', title: 'إضافة صفحة', action: () => addNewPage() }]
  });
  const pagesChildren = pagesNode.querySelector('.tree-children');
  book.pages.forEach((page, i) => {
    const pageNode = makeTreeNode({
      label: '📄 ' + (i + 1) + '. ' + (page.titreSection || 'صفحة'),
      type: 'page', params: { pageIndex: i }
    });
    const pChildren = pageNode.querySelector('.tree-children');

    // Vocabulaire
    const vocabNode = makeTreeNode({
      label: '📖 المفردات (' + (page.vocabulaire?.length || 0) + ')',
      type: 'vocab-list', params: { pageIndex: i },
      actions: [{ label: '+', title: 'إضافة كلمة', action: () => addVocabItem(i) }]
    });
    const vChildren = vocabNode.querySelector('.tree-children');
    (page.vocabulaire || []).forEach((v, vi) => {
      vChildren.appendChild(makeTreeNode({
        label: '📌 ' + (v.mot || 'كلمة'),
        type: 'vocab-item', params: { pageIndex: i, vocabIndex: vi }
      }));
    });
    pChildren.appendChild(vocabNode);

    // Exercices
    const exNode = makeTreeNode({
      label: '🎮 التمارين (' + (page.exercices?.length || 0) + ')',
      type: 'exercises-list', params: { pageIndex: i },
      actions: [{ label: '+', title: 'إضافة تمرين', action: () => openAddExerciseMenu(i) }]
    });
    const eChildren = exNode.querySelector('.tree-children');
    (page.exercices || []).forEach((ex, ei) => {
      eChildren.appendChild(makeTreeNode({
        label: '🎯 ' + labelOfType(ex.type),
        type: 'exercise', params: { pageIndex: i, exIndex: ei }
      }));
    });
    pChildren.appendChild(exNode);

    // Notes
    pChildren.appendChild(makeTreeNode({
      label: '📌 ملاحظات',
      type: 'notes', params: { pageIndex: i }
    }));

    pagesChildren.appendChild(pageNode);
  });
  ul.appendChild(pagesNode);

  // Résumé
  ul.appendChild(makeTreeNode({
    label: '📝 الملخص',
    type: 'summary', params: {}
  }));

  tree.appendChild(ul);
  highlightActiveNode();
}

function makeTreeNode(opts) {
  const li = document.createElement('li');
  li.className = 'tree-node';
  li.dataset.key = nodeKey(opts.type, opts.params);

  const row = document.createElement('div');
  row.className = 'tree-row';

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  toggle.textContent = '▾';
  row.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'tree-label';
  label.textContent = opts.label;
  row.appendChild(label);

  (opts.actions || []).forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'tree-action';
    btn.textContent = a.label;
    btn.title = a.title || '';
    btn.onclick = (e) => { e.stopPropagation(); a.action(); };
    row.appendChild(btn);
  });

  row.onclick = (e) => {
    if (e.target.closest('.tree-action') || e.target === toggle) return;
    selectNode(opts.type, opts.params);
  };

  toggle.onclick = (e) => {
    e.stopPropagation();
    li.classList.toggle('collapsed');
  };

  li.appendChild(row);

  const children = document.createElement('div');
  children.className = 'tree-children';
  li.appendChild(children);

  return li;
}

function highlightActiveNode() {
  document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
  const key = nodeKey(activeNode.type, activeNode.params);
  const el = document.querySelector(`.tree-node[data-key="${key}"] > .tree-row`);
  if (el) el.classList.add('active');
}

function selectNode(type, params) {
  activeNode = { type, params };
  renderContextPanel();
  highlightActiveNode();
}

/* ============ PANNEAU CONTEXTUEL ============ */
function renderContextPanel() {
  const panel = document.getElementById('contextPanel');
  const { type, params } = activeNode;
  let html = '';

  if (type === 'book-info') html = getBookInfoFormHTML();
  else if (type === 'pages-list') html = getPagesListFormHTML();
  else if (type === 'page') html = getPageFormHTML(params.pageIndex);
  else if (type === 'vocab-list') html = getVocabListFormHTML(params.pageIndex);
  else if (type === 'vocab-item') html = getVocabItemFormHTML(params.pageIndex, params.vocabIndex);
  else if (type === 'exercises-list') html = getExercisesListFormHTML(params.pageIndex);
  else if (type === 'exercise') html = getExerciseFormHTML(params.pageIndex, params.exIndex);
  else if (type === 'notes') html = getNotesFormHTML(params.pageIndex);
  else if (type === 'summary') html = getSummaryFormHTML();
  else html = '<div class="card">اختر عنصراً من القائمة</div>';

  panel.innerHTML = html;
}

/* ---------- UPDATE HANDLERS ---------- */
function updateBookField(k, v) { book[k] = v; renderTree(); scheduleAutoSave(); }
function updateSummaryField(k, v) { book.resume[k] = v; scheduleAutoSave(); }
function updatePageField(pi, k, v) {
  book.pages[pi][k] = v;
  if (k === 'titreSection') renderTree();
  if (k === 'audioMode') {
    const box = document.getElementById('mp3Tools-' + pi);
    if (box) box.style.display = v === 'mp3' ? 'block' : 'none';
  }
  scheduleAutoSave();
}
function updateVocabField(pi, vi, k, v) {
  book.pages[pi].vocabulaire[vi][k] = v;
  if (k === 'mot') renderTree();
  scheduleAutoSave();
}
function updateVocabSyn(pi, vi, v) {
  book.pages[pi].vocabulaire[vi].synonymes = splitMots(v);
  scheduleAutoSave();
}
function updateExerciseField(pi, ei, k, v) {
  book.pages[pi].exercices[ei][k] = v;
  scheduleAutoSave();
}
function updateFillReponses(pi, ei, v) {
  const reps = splitMots(v);
  book.pages[pi].exercices[ei].reponses = reps;
  rebuildMotsMelanges(pi, ei);
  scheduleAutoSave();
}
function updateFillLeurres(pi, ei, v) {
  book.pages[pi].exercices[ei].leurres = splitMots(v);
  rebuildMotsMelanges(pi, ei);
  scheduleAutoSave();
}
function rebuildMotsMelanges(pi, ei) {
  const ex = book.pages[pi].exercices[ei];
  const all = [...(ex.reponses || []), ...(ex.leurres || [])];
  ex.motsMelanges = [...new Set(all)];
}
function updateQcmOptions(pi, ei, v) {
  book.pages[pi].exercices[ei].options = splitMots(v);
  scheduleAutoSave();
}

/* Zones */
function addZone(pi, ei) {
  const ex = book.pages[pi].exercices[ei];
  ex.zones = ex.zones || [];
  ex.zones.push({ label: '', reponse: '' });
  renderContextPanel();
}
function deleteZone(pi, ei, zi) {
  book.pages[pi].exercices[ei].zones.splice(zi, 1);
  renderContextPanel();
  scheduleAutoSave();
}
function updateZone(pi, ei, zi, k, v) {
  book.pages[pi].exercices[ei].zones[zi][k] = v;

        brut.push(ort);

async function importFromPc(input) {
  if (!input.files?.[0]) return;
  const file = input.files[0];
  const name = file.name.toLowerCase();
  try {
    if (name.endsWith('.json')) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      loadImportedBook(parsed);
      showToast('✅ تم الاستيراد من JSON');
      closeModal('importModal');
    } else if (name.endsWith('.zip')) {
      const zip = await JSZip.loadAsync(file);
      let jsonEntry = null;
      const mediaEntries = {};
      zip.forEach((path, entry) => {
        if (entry.dir) return;
        const base = path.split('/').pop();
        if (base === 'livre.json') jsonEntry = entry;
        else mediaEntries[base] = entry;
      });
      if (!jsonEntry) throw new Error('livre.json غير موجود');
      const parsed = JSON.parse(await jsonEntry.async('text'));

      // Recharger les médias
      const loadB64 = async (entry) => {
        const b64 = await entry.async('base64');
        return 'data:application/octet-stream;base64,' + b64;
      };
      if (mediaEntries['couverture.jpg']) parsed.couvertureData = await loadB64(mediaEntries['couverture.jpg']);
      if (parsed.pages) {
        for (let i = 0; i < parsed.pages.length; i++) {
          const p = parsed.pages[i];
          if (mediaEntries[`page${i+1}.jpg`]) p.imageData = await loadB64(mediaEntries[`page${i+1}.jpg`]);
          if (mediaEntries[`page${i+1}.mp3`]) p.audioData = await loadB64(mediaEntries[`page${i+1}.mp3`]);
        }
      }
      if (mediaEntries['resume.mp3']) parsed.resume = parsed.resume || {}, parsed.resume.audioData = await loadB64(mediaEntries['resume.mp3']);

      loadImportedBook(parsed);
      showToast('✅ تم الاستيراد من ZIP مع المédias');
      closeModal('importModal');
    }
  } catch (e) {
    alert('خطأ : ' + e.message);
  } finally {
    input.value = '';
  }
}

async function loadGithubCatalogue() {
  const owner = document.getElementById('impOwner').value.trim();
  const repo = document.getElementById('impRepo').value.trim();
  const branch = document.getElementById('impBranch').value.trim() || 'main';
  if (!owner || !repo) { alert('املأ Owner و Repo'); return; }

  const list = document.getElementById('githubBookList');
  list.innerHTML = '<p>⏳ جاري التحميل...</p>';

  // Deux sources en cascade (aucun header → aucun preflight CORS)
  const urls = [
    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/livres/catalogue.json`,
    `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/livres/catalogue.json`
  ];

  let cat = null, lastErr = '';
  for (const url of urls) {
    try {
      const res = await fetch(url);   // ⚠️ aucun header
      if (res.ok) { cat = await res.json(); break; }
      lastErr = `HTTP ${res.status} (${url})`;
    } catch (e) {
      lastErr = `${e.message} (${url})`;
    }
  }

  if (!cat) {
    list.innerHTML = `
      <div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;font-size:.9em;">
        ❌ تعذّر تحميل الفهرس.<br>
        <small style="direction:ltr;display:block;text-align:left;word-break:break-all;">${lastErr}</small>
      </div>`;
    return;
  }

  const livres = cat.livres || [];
  if (!livres.length) { list.innerHTML = '<p>لا توجد كتب.</p>'; return; }

  list.innerHTML = livres.map(l => `
    <div class="subcard" style="display:flex;justify-content:space-between;align-items:center;">
      <div><strong>${escapeHtml(l.titre)}</strong>
        <div style="font-size:.8em;color:#64748b;">${l.nombrePages || '?'} صفحة — ${l.niveau || ''}</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick='importFromGithub("${owner}","${repo}","${branch}","${l.fichierJSON}")'>📥 استيراد</button>
    </div>
  `).join('');
}

async function importFromGithub(owner, repo, branch, token, filePath) {
  showToast('⏳ تحميل...');
  try {
    const base = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}`;
    const res = await fetch(`${base}/${filePath}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const parsed = await res.json();

    // Essayer de recharger les médias
    const tryFetchB64 = async (url) => {
      try {
        const r = await fetch(url);
        if (!r.ok) return null;
        const blob = await r.blob();
        return await new Promise(res => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.readAsDataURL(blob);
        });
      } catch { return null; }
    };
    if (parsed.couverture) {
      const b = await tryFetchB64(`${base}/${parsed.couverture}`);
      if (b) parsed.couvertureData = b;
    }
    if (parsed.pages) {
      for (const p of parsed.pages) {
        if (p.image) { const b = await tryFetchB64(`${base}/${p.image}`); if (b) p.imageData = b; }
        if (p.audioPage) { const b = await tryFetchB64(`${base}/${p.audioPage}`); if (b) p.audioData = b; }
      }
    }
    if (parsed.resume?.audio) {
      const b = await tryFetchB64(`${base}/${parsed.resume.audio}`);
      if (b) parsed.resume.audioData = b;
    }

    loadImportedBook(parsed);
    closeModal('importModal');
    showToast('✅ تم الاستيراد من GitHub');
  } catch (e) { alert('خطأ : ' + e.message); }
}

async function exportFullPackageToGitHub() {

  const branch = document.getElementById('ghBranch').value.trim() || 'main';

  document.getElementById('ghUrlsSection').style.display = 'none';
  document.getElementById('ghLogBox').innerHTML = '';
  btn.disabled = true;

  const headers = {
    'Authorization': `token ${token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };

  const upload = async (path, contentB64) => {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    let sha = null;
    try {
      const res = await fetch(url, { headers });
      if (res.ok) sha = (await res.json()).sha;
    } catch {}
    const put = await fetch(url, {
      method: 'PUT', headers,
      body: JSON.stringify({ message: `Update ${path}`, content: contentB64, branch, sha: sha || undefined })
    });
    if (!put.ok) throw new Error((await put.json()).message || 'HTTP ' + put.status);
  };

  try {
    addGhLog(`🚀 رفع "${book.titre}" إلى ${owner}/${repo}`);
    await upload(`livres/${id}/livre.json`, btoa(unescape(encodeURIComponent(JSON.stringify(clean, null, 2)))));
    bar.style.width = '40%'; bar.textContent = '40%';
    addGhLog('✅ livre.json');

    if (book.couvertureData?.includes('base64,')) {
      addGhLog('صورة الغلاف...');
      await upload(`livres/${id}/couverture.jpg`, book.couvertureData.split('base64,')[1]);
    }
    for (let i = 0; i < book.pages.length; i++) {
      const p = book.pages[i];

        addGhLog(`صورة صفحة ${i+1}`);

      }
      if (p.audioData?.includes('base64,')) {
        addGhLog(`صوت صفحة ${i+1}`);
        await upload(`livres/${id}/page${i+1}.mp3`, p.audioData.split('base64,')[1]);
      }
    }
    if (book.resume?.audioData?.includes('base64,')) {
      addGhLog('صوت الملخص');
      await upload(`livres/${id}/resume.mp3`, book.resume.audioData.split('base64,')[1]);
    }
    bar.style.width = '80%'; bar.textContent = '80%';

    // Mise à jour du catalogue
    addGhLog('تحديث catalogue.json...');
    const catUrl = `https://api.github.com/repos/${owner}/${repo}/contents/livres/catalogue.json`;
    let cat = { derniereMAJ: new Date().toISOString(), livres: [] };
    let catSha = null;
    try {
      const res = await fetch(catUrl, { headers });
      if (res.ok) {
        const d = await res.json();
        catSha = d.sha;
        cat = JSON.parse(decodeURIComponent(escape(atob(d.content))));
      }
    } catch {}

    const entry = {
      id, titre: book.titre, description: book.description,
      couverture: `livres/${id}/couverture.jpg`,
      resume: (book.resume?.texte || '').substring(0, 150),

      fichierJSON: `livres/${id}/livre.json`,
      dateMAJ: new Date().toISOString()
    };
    const ex = cat.livres.findIndex(l => l.id === id);
    if (ex !== -1) cat.livres[ex] = entry; else cat.livres.push(entry);
    cat.derniereMAJ = new Date().toISOString();

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/livres/catalogue.json`;
    const put = await fetch(url, {
      method: 'PUT', headers,
      body: JSON.stringify({
        message: 'Update catalogue.json',
        content: btoa(unescape(encodeURIComponent(JSON.stringify(cat, null, 2)))),
        branch, sha: catSha || undefined
      })
    });
    if (!put.ok) throw new Error('فشل تحديث الفهرس');

    bar.style.width = '100%'; bar.textContent = '100%';
    addGhLog('🎉 اكتمل');
    const finalUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/livres/catalogue.json`;
    document.getElementById('finalCatalogUrl').value = finalUrl;
    document.getElementById('ghUrlsSection').style.display = 'block';
    showToast('🎉 تم النشر');
  } catch (e) {
    addGhLog('❌ ' + e.message);
    alert('خطأ : ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

/* ============ JSON VIEWER ============ */
function openJsonViewer() {
  refreshJsonViewer();
  openModal('jsonModal');
}
function refreshJsonViewer() {
  const clean = buildCleanJson();
  document.getElementById('jsonViewerContent').textContent = JSON.stringify(clean, null, 2);
}
function copyJsonToClipboard() {
  const txt = document.getElementById('jsonViewerContent').textContent;
  navigator.clipboard.writeText(txt).then(() => showToast('📋 تم النسخ'));
}
function downloadJson() {
  const txt = document.getElementById('jsonViewerContent').textContent;
  const blob = new Blob([txt], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${book.id || 'livre'}.json`;
  a.click();
}

/* ============ NEW BOOK ============ */
function newBook() {
  if (!confirm('سيتم حذف العمل الحالي. متابعة؟')) return;
  book = makeEmptyBook();
  activeNode = { type: 'book-info', params: {} };
  renderTree();
  renderContextPanel();
  scheduleAutoSave();
  showToast('✨ كتاب جديد');
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', () => {
  const hasDraft = loadDraft();
  renderTree();
  renderContextPanel();
  if (hasDraft) {
    showToast('📂 تم استرجاع المسودة المحفوظة', '#0284c7');
  }
});
</script>
